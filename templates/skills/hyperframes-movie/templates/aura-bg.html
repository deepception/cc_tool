<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #1a1a2e;
        }
        #aura-canvas {
          position: absolute;
          inset: 0;
          display: block;
          pointer-events: none; /* overlays must not count as occluders in the layout audit */
          width: 100%;
          height: 100%;
        }
      </style>

      <!-- The live background: a domain-warped liquid in the brand palette under the whole film.
           Opaque scenes cover it; scenes with ground "aura" let it show. Keys come from build.py. -->
      <div id="root" data-composition-id="aura-bg" data-width="1920" data-height="1080" data-duration="60">
        <canvas id="aura-canvas" width="1920" height="1080"></canvas>
      </div>

      <script type="module">
        import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.181.2/+esm";
        // Raw brand hexes straight into the shader: no sRGB→linear conversion we would never undo.
        THREE.ColorManagement.enabled = false;

        const TOTAL = /*@total*/ 60;
        // [time, amplitude 0–1, colour a, colour b, colour c] per scene, from build.py
        const KEYS = /*@data:AURA*/[]/*@end*/;

        const canvas = document.getElementById("aura-canvas");
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
        renderer.setPixelRatio(1);
        renderer.setSize(1920, 1080, false);
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const uniforms = {
          uTime: { value: 0 },
          uAmp: { value: 0 },
          uBase: { value: new THREE.Color("#1a1a2e") },
          uA: { value: new THREE.Color("#5a2350") },
          uB: { value: new THREE.Color("#b0679a") },
          uC: { value: new THREE.Color("#3fa9c9") },
          uRes: { value: new THREE.Vector2(1920, 1080) },
        };
        scene.add(
          new THREE.Mesh(
            new THREE.PlaneGeometry(2, 2),
            new THREE.ShaderMaterial({
              uniforms,
              vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
              fragmentShader: `
                precision highp float;
                varying vec2 vUv;
                uniform float uTime, uAmp;
                uniform vec3 uBase, uA, uB, uC;
                uniform vec2 uRes;
                float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
                float noise(vec2 p) {
                  vec2 i = floor(p), f = fract(p);
                  vec2 u = f * f * (3.0 - 2.0 * f);
                  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
                }
                float fbm(vec2 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.02 + 17.0; a *= 0.5; } return v; }
                void main() {
                  vec2 p = (vUv - 0.5) * vec2(uRes.x / uRes.y, 1.0) * 2.2;
                  float t = uTime * 0.22;
                  vec2 q = vec2(fbm(p + t), fbm(p + vec2(5.2, 1.3) - t));
                  vec2 r = vec2(fbm(p + 3.0 * q + vec2(1.7, 9.2) + t * 1.3), fbm(p + 3.0 * q + vec2(8.3, 2.8) - t));
                  float f = fbm(p + 3.5 * r);
                  vec3 col = mix(uA, uB, smoothstep(0.25, 0.75, f));
                  col = mix(col, uC, smoothstep(0.55, 0.95, length(r) * 0.8));
                  float ridge = pow(1.0 - abs(f * 2.0 - 1.0), 6.0);
                  col += vec3(0.95, 0.9, 1.0) * ridge * 0.28;
                  float vign = smoothstep(1.35, 0.25, length((vUv - 0.5) * vec2(1.6, 1.0)));
                  gl_FragColor = vec4(mix(uBase, col, uAmp * (0.35 + 0.65 * f) * vign), 1.0);
                }`,
            }),
          ),
        );

        const st = { t: 0, amp: 0, a: "#5a2350", b: "#b0679a", c: "#3fa9c9" };
        const render = () => {
          uniforms.uTime.value = st.t;
          uniforms.uAmp.value = st.amp;
          uniforms.uA.value.set(st.a);
          uniforms.uB.value.set(st.b);
          uniforms.uC.value.set(st.c);
          renderer.render(scene, camera);
        };
        // The shader is a pure function of `st`; the paused timeline owns `st`, so every seek is exact.
        const tl = gsap.timeline({ paused: true, onUpdate: render });
        tl.to(st, { t: TOTAL, duration: TOTAL, ease: "none" }, 0);
        KEYS.forEach(([at, amp, a, b, c]) => tl.to(st, { amp, a, b, c, duration: 0.4, ease: "power2.out" }, at));
        render();
        window.__timelines["aura-bg"] = tl;
      </script>
    </template>
  </body>
</html>
